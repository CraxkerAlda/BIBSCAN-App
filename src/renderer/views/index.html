<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';">
    <title>BIBSCAN - Panel de control</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="dashboard">
    <div id="app-shell" class="app-shell">
        <aside id="sidebar-slot" class="sidebar"></aside>
        <div class="app-main">
            <header id="topbar-slot"></header>
            <main class="content" id="page-content">
                <div class="section-heading">
                    <div>
                        <h1>Panel de control</h1>
                        <p class="muted">Resumen general de la biblioteca</p>
                    </div>
                </div>

                <div class="stats-grid" id="stats-grid"></div>

                <div class="grid grid--2">
                    <div class="card">
                        <div class="card__header">
                            <h3 class="card__header-title">Consulta por código de barras</h3>
                        </div>
                        <div class="card__body">
                            <div class="field">
                                <label for="scan-code">Escanee o ingrese el código</label>
                                <input class="input scanner-input" type="text" id="scan-code"
                                       placeholder="Escaneando..." autocomplete="off" autofocus>
                            </div>
                            <div id="scan-result"></div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card__header">
                            <h3 class="card__header-title">Accesos rápidos</h3>
                        </div>
                        <div class="card__body">
                            <div class="quick-actions">
                                <a class="quick-action" href="catalogo.html">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5a2 2 0 012-2h4v18H5a2 2 0 01-2-2V5z"/><path d="M21 5a2 2 0 00-2-2h-4v18h4a2 2 0 002-2V5z"/></svg>
                                    <span>Gestionar catálogo<small class="quick-action__desc" style="display:block">Registrar y consultar libros</small></span>
                                </a>
                                <a class="quick-action" href="prestamos.html">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 13h4"/></svg>
                                    <span>Préstamos y devoluciones<small class="quick-action__desc" style="display:block">Registrar movimientos con escáner</small></span>
                                </a>
                                <a class="quick-action quick-action--admin" href="usuarios.html">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.5a3.5 3.5 0 010 7M17.5 14a6.5 6.5 0 014 6"/></svg>
                                    <span>Administrar usuarios<small class="quick-action__desc" style="display:block">Alumnos y docentes</small></span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            <footer id="footer-slot" class="footer"></footer>
        </div>
    </div>

    <script src="../js/ui.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/app-renderer.js"></script>
</body>
</html>

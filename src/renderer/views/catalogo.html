<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';">
    <title>BIBSCAN - Catálogo</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="catalogo">
    <div id="app-shell" class="app-shell">
        <aside id="sidebar-slot" class="sidebar"></aside>
        <div class="app-main">
            <header id="topbar-slot"></header>
            <main class="content" id="page-content">
                <div class="section-heading">
                    <div>
                        <h1>Catálogo de libros</h1>
                        <p class="muted">Consulta, registro y etiquetas de código de barras</p>
                    </div>
                    <button type="button" class="btn btn--primary toolbar-action--admin" id="btn-nuevo-libro">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
                        <span>Nuevo libro</span>
                    </button>
                </div>

                <div class="toolbar">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
                        <input class="input" type="text" id="search-catalogo"
                               placeholder="Buscar por código, título, autor, categoría o editorial..."
                               autocomplete="off">
                    </div>
                    <span class="muted toolbar__count" id="result-count"></span>
                </div>

                <div class="card">
                    <div class="table-wrap">
                        <table class="table" id="catalogo-table">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Título</th>
                                    <th>Autor</th>
                                    <th>Categoría</th>
                                    <th>Editorial</th>
                                    <th>Año</th>
                                    <th>Estado</th>
                                    <th class="col-actions">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="catalogo-body"></tbody>
                        </table>
                    </div>
                    <div id="catalogo-empty"></div>
                </div>
            </main>
            <footer id="footer-slot" class="footer"></footer>
        </div>
    </div>

    <script src="../vendor/jsbarcode/JsBarcode.all.min.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/app-renderer.js"></script>
</body>
</html>
